plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.terminalemulator'
version = '0.1.0'

android {
  namespace "expo.modules.terminalemulator"
  ndkVersion "26.1.10909125"

  defaultConfig {
    versionCode 1
    versionName "0.1.0"
    externalNativeBuild {
      cmake {
        cppFlags ""
        // bug #139 (2026-04-27): arm64-only, see app.config.ts comment
        abiFilters "arm64-v8a"
      }
    }
  }

  externalNativeBuild {
    cmake {
      path "CMakeLists.txt"
    }
  }

  sourceSets {
    main {
      jniLibs.srcDirs = ['src/main/jniLibs']
    }
  }

  lint {
    abortOnError false
  }
}

dependencies {
  // Connectivity guardian (ShizukuLiveness.kt): Shizuku client API, used ONLY
  // for Shizuku.pingBinder(). The provider artifact supplies
  // rikka.shizuku.ShizukuProvider (declared in this module's manifest) and the
  // moe.shizuku.manager.permission.API_V23 uses-permission. Apache-2.0,
  // Maven Central, minSdk 24 (= Shelly's).
  implementation 'dev.rikka.shizuku:api:13.1.5'
  implementation 'dev.rikka.shizuku:provider:13.1.5'
  // TriggerDebouncerTest.kt — see that file's doc comment: not yet wired into
  // a CI test task (build-android.yml only runs assembleRelease), but placed
  // in the idiomatic src/test/java location so `./gradlew :terminal-emulator:testDebugUnitTest`
  // works correctly once that wiring exists.
  testImplementation 'junit:junit:4.13.2'
  // Real org.json for JVM unit tests (android.jar's is a throwing stub):
  // monitor/MonitorProgressTest.kt parses progress.jsonl lines.
  testImplementation 'org.json:json:20231013'
}
