name: Build Android APK

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '**/*.md'
  workflow_dispatch:
    inputs:
      signing:
        description: >-
          APK signing key. "default" follows SHELLY_DEFAULT_SIGNING_MODE below.
          "rotation" = APK Signature Scheme v3 key rotation (legacy debug key ->
          private release key, lineage in signing/); API 28+ installs update in
          place. "release" = private release key only (no lineage).
          "legacy-debug" = old public debug key only (pre-rotation builds).
        type: choice
        default: default
        options:
          - default
          - rotation
          - release
          - legacy-debug
      publish:
        description: Publish the APK to the update channel (android-dev for non-main refs)
        type: boolean
        default: true

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm check

      - name: Unit tests
        run: pnpm test -- --runInBand

  build:
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    env:
      # Signing-key migration (2026-10, see docs/superpowers/DEFERRED.md P0
      # "Release signing key migration"). Main stays on the legacy public
      # debug key until the owner approves the switch; then flip this to
      # `rotation` (v3 key rotation: existing API 28+ installs update in place
      # and are moved to the private key). Do NOT publish rotation-signed
      # builds to a channel while main is still legacy-debug: a rotated
      # install refuses later debug-only APKs.
      SHELLY_DEFAULT_SIGNING_MODE: legacy-debug
      # SHA-256 of the private Shelly release certificate (CN=Shelly, O=RYOITABASHI).
      SHELLY_RELEASE_CERT_SHA256: 1476d9520a49bf8da7a767cb413918ccd5c5fcd7f62603766af6521f30de212d
      # SHA-256 of the public RN/Expo debug.keystore certificate (legacy).
      SHELLY_LEGACY_DEBUG_CERT_SHA256: fac61745dc0903786fb9ede62a962b399f7348f0bb6f899b8332667591033b9c
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Compute daily bundle cache key
        id: bundle-cache-key
        run: echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Resolve CLI versions for payload cache
        run: |
          set -euo pipefail
          test -s .ci-versions/codex.txt || { echo "FATAL: .ci-versions/codex.txt is missing" >&2; exit 1; }
          test -s .ci-versions/codex-termux.txt || { echo "FATAL: .ci-versions/codex-termux.txt is missing" >&2; exit 1; }
          test -s .ci-versions/codex-termux.integrity || { echo "FATAL: .ci-versions/codex-termux.integrity is missing" >&2; exit 1; }
          CODEX_VERSION="$(tr -d '[:space:]' < .ci-versions/codex.txt)"
          CODEX_TERMUX_VERSION="$(tr -d '[:space:]' < .ci-versions/codex-termux.txt)"
          # codex-termux tags either mirror upstream (v0.156.1) or carry a fork
          # suffix (v0.162.1-termux.1); the binary and @openai/codex report the
          # upstream version either way.
          CODEX_TERMUX_UPSTREAM="${CODEX_TERMUX_VERSION#v}"
          CODEX_TERMUX_UPSTREAM="${CODEX_TERMUX_UPSTREAM%%-termux.*}"
          if [ "${CODEX_VERSION}" != "${CODEX_TERMUX_UPSTREAM}" ]; then
            echo "FATAL: @openai/codex ${CODEX_VERSION} must match codex-termux ${CODEX_TERMUX_VERSION}" >&2
            exit 1
          fi
          printf 'codex: %s\n' "${CODEX_VERSION}"
          printf 'codex-termux: %s\n' "${CODEX_TERMUX_VERSION}"

      - name: Restore generated Android payload cache
        id: android-payload-cache
        uses: actions/cache@v4
        with:
          path: |
            modules/terminal-emulator/android/src/main/jniLibs/arm64-v8a/libgit_remote_https.so
            modules/terminal-emulator/android/src/main/jniLibs/arm64-v8a/libgit_remote_http.so
            modules/terminal-emulator/android/src/main/jniLibs/arm64-v8a/libssh_keygen.so
            modules/terminal-emulator/android/src/main/jniLibs/arm64-v8a/libgh.so
            modules/terminal-emulator/android/src/main/jniLibs/arm64-v8a/libgpg.so
            modules/terminal-emulator/android/src/main/jniLibs/arm64-v8a/libgpg_agent.so
            modules/terminal-emulator/android/src/main/jniLibs/arm64-v8a/libnano.so
            modules/terminal-emulator/android/src/main/jniLibs/arm64-v8a/libunzip.so
            modules/terminal-emulator/android/src/main/jniLibs/arm64-v8a/libgit_credential_store.so
            modules/terminal-emulator/android/src/main/jniLibs/arm64-v8a/libgit_credential_cache.so
            modules/terminal-emulator/android/src/main/jniLibs/arm64-v8a/libbz2_1.so
            modules/terminal-emulator/android/src/main/jniLibs/arm64-v8a/libgcrypt.so
            modules/terminal-emulator/android/src/main/jniLibs/arm64-v8a/libgpg_error.so
            modules/terminal-emulator/android/src/main/jniLibs/arm64-v8a/libassuan.so
            modules/terminal-emulator/android/src/main/jniLibs/arm64-v8a/libksba.so
            modules/terminal-emulator/android/src/main/jniLibs/arm64-v8a/libnpth.so
            modules/terminal-emulator/android/src/main/jniLibs/arm64-v8a/libcodex_tui.so
            modules/terminal-emulator/android/src/main/jniLibs/arm64-v8a/libcodex_cxx_shared.so
            modules/terminal-emulator/android/src/main/jniLibs/arm64-v8a/libcodex_code_mode_host.so
            modules/terminal-emulator/android/src/main/jniLibs/arm64-v8a/libshelly_shell.so
            modules/terminal-emulator/android/src/main/jniLibs/arm64-v8a/libshelly_xdg_open.so
            modules/terminal-emulator/android/src/main/jniLibs/arm64-v8a/libshelly_cmd.so
            modules/terminal-emulator/android/src/main/assets/cli-tools.tar.gz
          key: android-payloads-${{ runner.os }}-${{ steps.bundle-cache-key.outputs.date }}-${{ hashFiles('.github/workflows/build-android.yml', '.ci-versions/codex.txt', '.ci-versions/codex-termux.txt', '.ci-versions/codex-termux.integrity', 'modules/terminal-emulator/android/src/main/jni/*.c', 'modules/terminal-emulator/android/src/main/java/expo/modules/terminalemulator/LibExtractor.kt', 'modules/terminal-emulator/android/src/main/java/expo/modules/terminalemulator/HomeInitializer.kt', 'pnpm-lock.yaml') }}
          restore-keys: |
            android-payloads-${{ runner.os }}-${{ steps.bundle-cache-key.outputs.date }}-

      - name: Install aarch64 cross-binutils (for strip --strip-unneeded)
        if: steps.android-payload-cache.outputs.cache-hit != 'true'
        # bug #139 (2026-04-27): the next step strips Termux .deb extracts
        # to remove debug+local symbols (~25-35 MB total APK savings).
        # Ubuntu-latest's system `strip` is x86_64-only and rejects
        # aarch64 ELFs. binutils-aarch64-linux-gnu provides
        # `aarch64-linux-gnu-strip` which handles aarch64 ELFs cross-arch.
        # We can't use NDK's llvm-strip here because Setup Android SDK
        # runs much later in this workflow.
        run: sudo apt-get install -y --no-install-recommends binutils-aarch64-linux-gnu

      - name: Bundle Termux extras (git-remote-https, ssh-keygen) — bug #128
        if: steps.android-payload-cache.outputs.cache-hit != 'true'
        # Shelly bundles `git` itself but not the git-remote-https helper that
        # makes `git clone https://...` work, nor `ssh-keygen` for SSH key
        # generation. Without these, Shelly-on-Shelly development is
        # structurally blocked — every `git clone https://...` returns
        # "fatal: remote helper 'https' aborted session". User report
        # 2026-04-27.
        #
        # We pull the binaries from Termux's stable apt repo. Latest .deb
        # is resolved dynamically from the Packages.xz index so we follow
        # upstream automatically.
        run: |
          set -euo pipefail
          JNILIBS="modules/terminal-emulator/android/src/main/jniLibs/arm64-v8a"
          TERMUX_REPO_BASES=(
            "https://packages-cf.termux.dev/apt/termux-main"
            "https://packages.termux.dev/apt/termux-main"
          )

          curl_retry() {
            curl --fail --silent --show-error --location \
              --retry 4 --retry-all-errors --retry-delay 5 \
              --connect-timeout 20 --max-time 120 "$@"
          }

          # Fetch the Termux apt index. The mirror at
          # packages-cf.termux.dev historically served Packages.xz, but as of
          # 2026-04-27 only the uncompressed Packages and Packages.gz are
          # reliably present. Try in preference order: .xz → .gz →
          # uncompressed, across multiple mirrors. The build CI runner has
          # xz-utils + gzip pre-installed; only the uncompressed fallback would
          # also work without decoders, so it's the safety net.
          fetch_packages_index() {
            local url="$1" decoder="$2"
            if [ -n "$decoder" ]; then
              curl_retry "$url" | $decoder > /tmp/Packages.tmp 2>/dev/null \
                && [ -s /tmp/Packages.tmp ] \
                && mv /tmp/Packages.tmp /tmp/Packages \
                && return 0
            else
              curl_retry -o /tmp/Packages.tmp "$url" 2>/dev/null \
                && [ -s /tmp/Packages.tmp ] \
                && mv /tmp/Packages.tmp /tmp/Packages \
                && return 0
            fi
            rm -f /tmp/Packages.tmp
            return 1
          }
          REPO_BASE=""
          INDEX_SOURCE=""
          for candidate_repo in "${TERMUX_REPO_BASES[@]}"; do
            IDX_BASE="${candidate_repo}/dists/stable/main/binary-aarch64"
            if   fetch_packages_index "${IDX_BASE}/Packages.xz" "xz -d"; then
              REPO_BASE="${candidate_repo}"
              INDEX_SOURCE="Packages.xz"
              break
            elif fetch_packages_index "${IDX_BASE}/Packages.gz" "gzip -d"; then
              REPO_BASE="${candidate_repo}"
              INDEX_SOURCE="Packages.gz"
              break
            elif fetch_packages_index "${IDX_BASE}/Packages" ""; then
              REPO_BASE="${candidate_repo}"
              INDEX_SOURCE="Packages (uncompressed)"
              break
            else
              echo "[termux-extras] WARN: could not fetch index from ${IDX_BASE}" >&2
            fi
          done
          if [ -z "${REPO_BASE}" ]; then
            echo "FATAL: could not fetch Termux Packages index from any configured mirror" >&2
            exit 1
          fi
          test -s /tmp/Packages || { echo "FATAL: empty Packages index"; exit 1; }
          echo "[termux-extras] repo mirror: ${REPO_BASE}"
          echo "[termux-extras] index source: ${INDEX_SOURCE}"
          echo "[termux-extras] index size: $(wc -c < /tmp/Packages) bytes"

          # Filename helper (paragraph-mode awk lookup)
          find_filename() {
            awk -v pkg="$1" -v RS= '
              /^Package:/ {
                for (i = 1; i <= NF; i++) {
                  if ($i == "Package:" && $(i+1) == pkg) {
                    matched = 1
                  }
                }
              }
              matched && /Filename:/ {
                for (i = 1; i <= NF; i++) {
                  if ($i == "Filename:") {
                    print $(i+1)
                    exit
                  }
                }
              }
            ' /tmp/Packages
          }

          # Extract a Termux .deb's payload to a directory.
          extract_deb() {
            local deb="$1" outdir="$2"
            mkdir -p "$outdir"
            (cd "$outdir" && ar x "$deb")
            if [ -f "$outdir/data.tar.xz" ]; then
              tar -xf "$outdir/data.tar.xz" -C "$outdir"
            elif [ -f "$outdir/data.tar.zst" ]; then
              zstd -d "$outdir/data.tar.zst" -o "$outdir/data.tar"
              tar -xf "$outdir/data.tar" -C "$outdir"
            elif [ -f "$outdir/data.tar.gz" ]; then
              tar -xzf "$outdir/data.tar.gz" -C "$outdir"
            else
              echo "FATAL: unknown payload format in $deb"; ls -la "$outdir"; exit 1
            fi
          }

          # 1. git-remote-https (and -http for non-TLS) from `git` package
          GIT_FILENAME=$(find_filename git)
          [ -n "$GIT_FILENAME" ] || { echo "FATAL: git package not found in Packages index"; exit 1; }
          echo "[termux-extras] git: ${GIT_FILENAME}"
          curl_retry -o /tmp/git.deb "${REPO_BASE}/${GIT_FILENAME}"
          extract_deb /tmp/git.deb /tmp/git-pkg
          for helper in git-remote-https git-remote-http; do
            src="/tmp/git-pkg/data/data/com.termux/files/usr/libexec/git-core/${helper}"
            dst="${GITHUB_WORKSPACE}/${JNILIBS}/lib${helper//-/_}.so"
            if [ ! -f "$src" ]; then
              echo "FATAL: ${helper} not found in git package at $src"
              find /tmp/git-pkg/data/data/com.termux/files/usr/libexec -name 'git-remote-*' || true
              exit 1
            fi
            cp "$src" "$dst"
            chmod 755 "$dst"
            # bug #139 (2026-04-27): strip Termux .deb extracts. Termux's
            # apt mirror sometimes ships unstripped binaries (esp. the
            # gpg cascade — gh as a Go binary saves 15+ MB stripped).
            # --strip-unneeded preserves DT_NEEDED + dynamic symbols
            # required for runtime resolution; only debug + local symbols
            # are removed. NDK clang's llvm-strip is ABI-aware for
            # aarch64. Failure is non-fatal (already-stripped binaries
            # warn but the file remains usable).
            aarch64-linux-gnu-strip --strip-unneeded "$dst" 2>/dev/null || true
            echo "[termux-extras] bundled ${helper} → $(basename "$dst") ($(stat -c %s "$dst") bytes)"
          done

          # 2. ssh-keygen from `openssh` package
          SSH_FILENAME=$(find_filename openssh)
          [ -n "$SSH_FILENAME" ] || { echo "FATAL: openssh package not found in Packages index"; exit 1; }
          echo "[termux-extras] openssh: ${SSH_FILENAME}"
          curl_retry -o /tmp/openssh.deb "${REPO_BASE}/${SSH_FILENAME}"
          extract_deb /tmp/openssh.deb /tmp/openssh-pkg
          src="/tmp/openssh-pkg/data/data/com.termux/files/usr/bin/ssh-keygen"
          dst="${GITHUB_WORKSPACE}/${JNILIBS}/libssh_keygen.so"
          if [ ! -f "$src" ]; then
            echo "FATAL: ssh-keygen not found in openssh package at $src"
            find /tmp/openssh-pkg/data/data/com.termux/files/usr/bin -name 'ssh*' || true
            exit 1
          fi
          cp "$src" "$dst"
          chmod 755 "$dst"
          aarch64-linux-gnu-strip --strip-unneeded "$dst" 2>/dev/null || true
          echo "[termux-extras] bundled ssh-keygen → $(basename "$dst") ($(stat -c %s "$dst") bytes)"

          # bug #130 (2026-04-27): Tier-1 dev essentials. Same Termux apt
          # mirror, same extract pattern. These are the binaries Codex
          # routinely complains about ("gh: command not found",
          # "gpg: not found", "unzip: not found") during
          # Shelly-on-Shelly dev. git-credential-* come from the git
          # package we already extracted in step 1.
          #
          # Each entry: <pkg>:<bin-name>:<src-path-after-/usr>:<dst-name>
          # When pkg is "_git_extracted" we reuse the already-extracted
          # /tmp/git-pkg payload to avoid re-downloading. When pkg is
          # "_openssh_extracted" we reuse /tmp/openssh-pkg.
          while IFS=: read -r pkg src_subpath dst_name; do
            [ -z "$pkg" ] && continue
            case "$pkg" in
              \#*) continue ;;
            esac
            case "$pkg" in
              _git_extracted)
                pkg_dir="/tmp/git-pkg"
                ;;
              _openssh_extracted)
                pkg_dir="/tmp/openssh-pkg"
                ;;
              *)
                pkg_filename=$(find_filename "$pkg")
                if [ -z "$pkg_filename" ]; then
                  echo "[termux-extras] WARN: ${pkg} package not in index, skipping"
                  continue
                fi
                echo "[termux-extras] ${pkg}: ${pkg_filename}"
                pkg_dir="/tmp/${pkg}-pkg"
                rm -rf "$pkg_dir"
                curl_retry -o "/tmp/${pkg}.deb" "${REPO_BASE}/${pkg_filename}"
                extract_deb "/tmp/${pkg}.deb" "$pkg_dir"
                ;;
            esac
            src="${pkg_dir}/data/data/com.termux/files/usr/${src_subpath}"
            dst="${GITHUB_WORKSPACE}/${JNILIBS}/${dst_name}"
            if [ ! -f "$src" ]; then
              echo "[termux-extras] WARN: ${dst_name} source missing at ${src}, skipping"
              continue
            fi
            cp "$src" "$dst"
            chmod 755 "$dst"
            aarch64-linux-gnu-strip --strip-unneeded "$dst" 2>/dev/null || true
            echo "[termux-extras] bundled ${dst_name} (from ${pkg}/${src_subpath}, $(stat -c %s "$dst") bytes)"
          done <<'EOF'
          gh:bin/gh:libgh.so
          gnupg:bin/gpg:libgpg.so
          gnupg:bin/gpg-agent:libgpg_agent.so
          nano:bin/nano:libnano.so
          unzip:bin/unzip:libunzip.so
          _git_extracted:libexec/git-core/git-credential-store:libgit_credential_store.so
          _git_extracted:libexec/git-core/git-credential-cache:libgit_credential_cache.so
          # bug #132 (2026-04-27): gpg + unzip both DT_NEEDED libbz2.so.1.0
          # but Shelly never bundled it. On-device repro: "CANNOT LINK
          # EXECUTABLE: library libbz2.so.1.0 not found". Pull from
          # Termux's libbz2 package, name as libbz2_1.so in apk lib/
          # (gradle apkPackager only accepts lib*.so without version
          # suffix), LibExtractor renames to libbz2.so.1.0 on disk
          # which is what gpg/unzip's DT_NEEDED references.
          libbz2:lib/libbz2.so.1.0:libbz2_1.so
          # bug #135 (2026-04-27, agent-reviewed): gpg's runtime dep
          # cascade. UNLIKE libbz2 (#132) which ships versioned
          # libbz2.so.1.0, Termux ships these libs UNVERSIONED — the
          # .deb has a single `usr/lib/libNAME.so` file with no
          # symlinks, and gpg's DT_NEEDED references match (e.g.
          # `libgcrypt.so` not `libgcrypt.so.20`). Verified against
          # current debs:
          #   libgcrypt_1.11.2-1, libgpg-error_1.58, libassuan_3.0.2-1,
          #   libksba_1.6.8, libnpth_1.6-3
          # Verified gpg's DT_NEEDED:
          #   libz.so.1, libbz2.so.1.0, libsqlite3.so, libgcrypt.so,
          #   libreadline.so.8, libassuan.so, libnpth.so, libgpg-error.so
          # Apk lib/ filenames use underscores instead of hyphens
          # (gradle compatibility); LibExtractor renames to the
          # hyphenated SONAMEs on disk where DT_NEEDED resolves.
          libgcrypt:lib/libgcrypt.so:libgcrypt.so
          libgpg-error:lib/libgpg-error.so:libgpg_error.so
          libassuan:lib/libassuan.so:libassuan.so
          libksba:lib/libksba.so:libksba.so
          libnpth:lib/libnpth.so:libnpth.so
          EOF

          # Verify the critical landings (T1 graceful — WARN not FATAL).
          # bug #135 review (2026-04-27): expanded to include libbz2 +
          # gpg cascade so future Termux upstream renames trigger an
          # immediate "MISSING:" line in CI logs instead of an apparently
          # green build that ships a broken APK.
          echo "[termux-extras] === landed files ==="
          for f in libgit_remote_https.so libgit_remote_http.so libssh_keygen.so \
                   libgh.so libgpg.so libgpg_agent.so libnano.so libunzip.so \
                   libgit_credential_store.so libgit_credential_cache.so \
                   libbz2_1.so \
                   libgcrypt.so libgpg_error.so libassuan.so libksba.so libnpth.so; do
            if [ -f "${GITHUB_WORKSPACE}/${JNILIBS}/$f" ]; then
              ls -lh "${GITHUB_WORKSPACE}/${JNILIBS}/$f"
            else
              echo "  MISSING: $f"
            fi
          done

      - name: Download codex-termux Android binary
        if: steps.android-payload-cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          JNILIBS="modules/terminal-emulator/android/src/main/jniLibs/arm64-v8a"
          # DioNanos/codex-termux has used two release asset layouts:
          #   1. legacy: codex-termux-android-arm64-<tag>.tar.gz + .sha256
          #   2. npm-pack: mmmbuto-codex-cli-termux-<version>.tgz
          # Release builds are pinned by .ci-versions so a source commit maps to
          # one Codex runtime. The separate bump workflow updates these pins.
          CODEX_TERMUX_VERSION="$(tr -d '[:space:]' < .ci-versions/codex-termux.txt)"
          CODEX_TERMUX_INTEGRITY="$(tr -d '[:space:]' < .ci-versions/codex-termux.integrity)"
          CODEX_TERMUX_FORMAT=""
          assets="$(gh release view "$CODEX_TERMUX_VERSION" --repo DioNanos/codex-termux --json assets --jq '.assets[].name')"
          CODEX_NPM_VERSION="${CODEX_TERMUX_VERSION#v}"
          if printf '%s\n' "$assets" | grep -qE "^mmmbuto-codex-cli-termux-${CODEX_NPM_VERSION}\.tgz$" &&
             printf '%s\n' "$CODEX_TERMUX_INTEGRITY" | grep -q '^sha512-'; then
            CODEX_TERMUX_FORMAT="npm-pack"
          elif printf '%s\n' "$assets" | grep -qE "^codex-termux-android-arm64-${CODEX_TERMUX_VERSION}\.tar\.gz$" &&
               printf '%s\n' "$CODEX_TERMUX_INTEGRITY" | grep -q '^sha256-'; then
            CODEX_TERMUX_FORMAT="legacy"
          else
            echo "FATAL: pinned codex-termux ${CODEX_TERMUX_VERSION} has no asset matching pinned integrity format" >&2
            exit 1
          fi
          echo "[codex] bundling codex-termux ${CODEX_TERMUX_VERSION} (${CODEX_TERMUX_FORMAT})"
          cd /tmp
          if [ "${CODEX_TERMUX_FORMAT}" = "legacy" ]; then
            gh release download "${CODEX_TERMUX_VERSION}" \
              --repo DioNanos/codex-termux \
              --pattern "codex-termux-android-arm64-${CODEX_TERMUX_VERSION}.tar.gz" \
              --pattern "codex-termux-android-arm64-${CODEX_TERMUX_VERSION}.tar.gz.sha256" \
              --dir /tmp \
              --clobber
            # DioNanos/codex-termux .sha256 files contain a bare hex digest
            # (no filename suffix), so sha256sum -c rejects them with
            # "no properly formatted checksum lines found". Read and compare manually.
            EXPECTED_HASH="${CODEX_TERMUX_INTEGRITY#sha256-}"
            ACTUAL_HASH="$(sha256sum "codex-termux-android-arm64-${CODEX_TERMUX_VERSION}.tar.gz" | awk '{print $1}')"
            if [ "${EXPECTED_HASH}" != "${ACTUAL_HASH}" ]; then
              echo "FATAL: sha256 mismatch for codex-termux tarball" >&2
              echo "  expected: ${EXPECTED_HASH}" >&2
              echo "  actual:   ${ACTUAL_HASH}" >&2
              exit 1
            fi
            echo "[codex] sha256 OK: ${ACTUAL_HASH}"
            mv "codex-termux-android-arm64-${CODEX_TERMUX_VERSION}.tar.gz" /tmp/codex-termux.tar.gz
          else
            gh release download "${CODEX_TERMUX_VERSION}" \
              --repo DioNanos/codex-termux \
              --pattern "mmmbuto-codex-cli-termux-${CODEX_NPM_VERSION}.tgz" \
              --dir /tmp \
              --clobber
            mv "mmmbuto-codex-cli-termux-${CODEX_NPM_VERSION}.tgz" /tmp/codex-termux.tar.gz
            EXPECTED_INTEGRITY="${CODEX_TERMUX_INTEGRITY}"
            ACTUAL_INTEGRITY="$(node -e 'const fs=require("fs"),crypto=require("crypto"); process.stdout.write("sha512-"+crypto.createHash("sha512").update(fs.readFileSync(process.argv[1])).digest("base64"))' /tmp/codex-termux.tar.gz)"
            if [ "${EXPECTED_INTEGRITY}" != "${ACTUAL_INTEGRITY}" ]; then
              echo "FATAL: npm integrity mismatch for codex-termux tarball" >&2
              echo "  expected: ${EXPECTED_INTEGRITY}" >&2
              echo "  actual:   ${ACTUAL_INTEGRITY}" >&2
              exit 1
            fi
            echo "[codex] npm integrity OK: ${ACTUAL_INTEGRITY}"
          fi
          rm -rf /tmp/codex-termux-extract
          mkdir -p /tmp/codex-termux-extract
          tar xzf /tmp/codex-termux.tar.gz -C /tmp/codex-termux-extract
          CODEX_TUI_BIN="$(find /tmp/codex-termux-extract -type f -name codex.bin | head -1)"
          CODEX_LIBCXX="$(find /tmp/codex-termux-extract -type f -name 'libc++_shared.so' | head -1)"
          CODEX_CODE_MODE_HOST="$(find /tmp/codex-termux-extract -type f -name codex-code-mode-host | head -1)"
          # Verify the upstream tarball still ships the unified binary we depend on.
          # If DioNanos/codex-termux ever renames or drops this file,
          # the next green build would silently produce an APK with codex
          # broken on-device. Fail loud here instead.
          if [ ! -f "$CODEX_TUI_BIN" ]; then
            echo "FATAL: expected codex.bin in codex-termux tarball; tarball contents:" >&2
            find /tmp/codex-termux-extract -maxdepth 4 -type f | sort >&2
            exit 1
          fi
          # Unified Codex binary. `codex exec ...` is dispatched by passing the
          # `exec` subcommand to this same binary, matching upstream codex-exec.
          cp "$CODEX_TUI_BIN" "${GITHUB_WORKSPACE}/${JNILIBS}/libcodex_tui.so"
          chmod 755 "${GITHUB_WORKSPACE}/${JNILIBS}/libcodex_tui.so"
          if [ -n "$CODEX_LIBCXX" ] && [ -f "$CODEX_LIBCXX" ]; then
            cp "$CODEX_LIBCXX" "${GITHUB_WORKSPACE}/${JNILIBS}/libcodex_cxx_shared.so"
            chmod 755 "${GITHUB_WORKSPACE}/${JNILIBS}/libcodex_cxx_shared.so"
          fi
          # Issue #149: Codex resolves its Code Mode host as
          # dirname(current_exe)/codex-code-mode-host. codex-termux ships an
          # Android/bionic PIE build of it; bundle it so LibExtractor places it
          # next to codex_tui. Without it Codex silently falls back to the
          # musl host from the npm dispatcher tree, which Android cannot exec.
          rm -f "${GITHUB_WORKSPACE}/${JNILIBS}/libcodex_code_mode_host.so"
          if [ -n "$CODEX_CODE_MODE_HOST" ] && [ -f "$CODEX_CODE_MODE_HOST" ]; then
            cp "$CODEX_CODE_MODE_HOST" "${GITHUB_WORKSPACE}/${JNILIBS}/libcodex_code_mode_host.so"
            chmod 755 "${GITHUB_WORKSPACE}/${JNILIBS}/libcodex_code_mode_host.so"
          else
            echo "::warning::codex-termux tarball has no codex-code-mode-host; Codex Code Mode will be unavailable on-device"
          fi
          rm -f "${GITHUB_WORKSPACE}/${JNILIBS}/libcodex_exec.so"
          ls -lh "${GITHUB_WORKSPACE}/${JNILIBS}/libcodex_tui.so"
          [ ! -f "${GITHUB_WORKSPACE}/${JNILIBS}/libcodex_cxx_shared.so" ] || ls -lh "${GITHUB_WORKSPACE}/${JNILIBS}/libcodex_cxx_shared.so"
          [ ! -f "${GITHUB_WORKSPACE}/${JNILIBS}/libcodex_code_mode_host.so" ] || ls -lh "${GITHUB_WORKSPACE}/${JNILIBS}/libcodex_code_mode_host.so"

      - name: Package Codex runtime update
        run: |
          set -euo pipefail
          JNILIBS="modules/terminal-emulator/android/src/main/jniLibs/arm64-v8a"
          runtime_dir="${RUNNER_TEMP}/codex-runtime"
          rm -rf "${runtime_dir}"
          mkdir -p "${runtime_dir}"
          cp "${JNILIBS}/libcodex_tui.so" "${runtime_dir}/codex_tui"
          chmod 755 "${runtime_dir}/codex_tui"
          if [ -f "${JNILIBS}/libcodex_cxx_shared.so" ]; then
            cp "${JNILIBS}/libcodex_cxx_shared.so" "${runtime_dir}/libc++_shared.so"
            chmod 755 "${runtime_dir}/libc++_shared.so"
          fi
          if [ -f "${JNILIBS}/libcodex_code_mode_host.so" ]; then
            cp "${JNILIBS}/libcodex_code_mode_host.so" "${runtime_dir}/codex-code-mode-host"
            chmod 755 "${runtime_dir}/codex-code-mode-host"
          fi
          node -e '
            const fs = require("fs");
            const crypto = require("crypto");
            const out = {};
            for (const name of fs.readdirSync(process.argv[1]).sort()) {
              const p = `${process.argv[1]}/${name}`;
              if (fs.statSync(p).isFile()) {
                out[name] = crypto.createHash("sha256").update(fs.readFileSync(p)).digest("hex");
              }
            }
            fs.writeFileSync(`${process.argv[1]}/files.sha256.json`, JSON.stringify(out, null, 2) + "\n");
          ' "${runtime_dir}"
          tar -C "${runtime_dir}" -czf "${RUNNER_TEMP}/codex-runtime.tar.gz" .
          sha256sum "${RUNNER_TEMP}/codex-runtime.tar.gz"
          ls -lh "${RUNNER_TEMP}/codex-runtime.tar.gz"

      - name: Bundle Codex JS dispatcher
        if: steps.android-payload-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          CODEX_VERSION="$(tr -d '[:space:]' < .ci-versions/codex.txt)"
          mkdir -p cli-bundle
          npm install -g --prefix ./cli-bundle --cpu=arm64 --os=linux \
            "@openai/codex@${CODEX_VERSION}"
          cd cli-bundle/lib
          tar czf ../../modules/terminal-emulator/android/src/main/assets/cli-tools.tar.gz node_modules
          cd ../..
          ls -lh modules/terminal-emulator/android/src/main/assets/cli-tools.tar.gz

      - name: Compute monotonic Android version code
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git_version_code="$(git rev-list --count HEAD)"
          desired_version_code="$((git_version_code + 1))"
          tmp_dir="$(mktemp -d)"
          trap 'rm -rf "${tmp_dir}"' EXIT

          for update_tag in android-latest android-dev; do
            tag_dir="${tmp_dir}/${update_tag}"
            mkdir -p "${tag_dir}"
            release_view_error="${tag_dir}/release-view.err"
            if ! manifest_asset="$(gh release view "${update_tag}" \
              --repo "${GITHUB_REPOSITORY}" \
              --json assets \
              --jq '.assets[] | select(.name == "latest.json") | .name' 2>"${release_view_error}")"; then
              if grep -qiE 'not found|HTTP 404' "${release_view_error}"; then
                echo "No ${update_tag} release found; ignoring for versionCode floor."
                continue
              fi
              cat "${release_view_error}" >&2
              exit 1
            fi
            if [ -z "${manifest_asset}" ]; then
              echo "No ${update_tag}/latest.json asset found; ignoring for versionCode floor."
              continue
            fi
            gh release download "${update_tag}" \
              --repo "${GITHUB_REPOSITORY}" \
              --pattern latest.json \
              --dir "${tag_dir}" >/dev/null

            published_version_code="$(node -e '
              const fs = require("fs");
              const manifestPath = process.argv[1];
              const manifest = JSON.parse(fs.readFileSync(manifestPath, "utf8"));
              if (!Number.isInteger(manifest.versionCode)) {
                console.error(`FATAL: ${manifestPath} is missing an integer versionCode`);
                process.exit(1);
              }
              process.stdout.write(String(manifest.versionCode));
            ' "${tag_dir}/latest.json")"

            if [ -n "${published_version_code}" ] && [ "${published_version_code}" -ge "${desired_version_code}" ]; then
              desired_version_code="$((published_version_code + 1))"
            fi
          done

          echo "SHELLY_ANDROID_VERSION_CODE=${desired_version_code}" >> "${GITHUB_ENV}"
          echo "Using SHELLY_ANDROID_VERSION_CODE=${desired_version_code}"

      - name: Validate Android config version code
        run: |
          GIT_VERSION_CODE="$(git rev-list --count HEAD)"
          MIN_GIT_VERSION_CODE="$((GIT_VERSION_CODE + 1))"
          if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
            echo "FATAL: checkout is shallow; versionCode would not be monotonic" >&2
            exit 1
          fi
          EXPECTED_VERSION_CODE="$(npx expo config --json | node -e '
            let input = "";
            process.stdin.on("data", chunk => input += chunk);
            process.stdin.on("end", () => {
              const config = JSON.parse(input);
              const versionCode = config.android && config.android.versionCode;
              if (!Number.isInteger(versionCode) || versionCode < 1) {
                process.exit(1);
              }
              process.stdout.write(String(versionCode));
            });
          ')"
          if [ -n "${SHELLY_ANDROID_VERSION_CODE:-}" ]; then
            if [ "${EXPECTED_VERSION_CODE}" != "${SHELLY_ANDROID_VERSION_CODE}" ]; then
              echo "FATAL: app.config.ts versionCode ${EXPECTED_VERSION_CODE} does not match SHELLY_ANDROID_VERSION_CODE ${SHELLY_ANDROID_VERSION_CODE}" >&2
              exit 1
            fi
            if [ "${EXPECTED_VERSION_CODE}" -lt "${MIN_GIT_VERSION_CODE}" ]; then
              echo "FATAL: SHELLY_ANDROID_VERSION_CODE ${EXPECTED_VERSION_CODE} is lower than git commit count + 1 (${MIN_GIT_VERSION_CODE})" >&2
              exit 1
            fi
          elif [ "${EXPECTED_VERSION_CODE}" -lt "${MIN_GIT_VERSION_CODE}" ]; then
            echo "FATAL: app.config.ts versionCode ${EXPECTED_VERSION_CODE} is lower than git commit count + 1 (${MIN_GIT_VERSION_CODE})" >&2
            exit 1
          fi
          if [ "${EXPECTED_VERSION_CODE}" -le 1502 ]; then
            echo "FATAL: android versionCode ${EXPECTED_VERSION_CODE} must be greater than the last shipped manual code 1502" >&2
            exit 1
          fi

      - name: Prebuild Android
        run: npx expo prebuild --platform android

      - name: Validate prebuilt Android version code
        run: |
          GIT_VERSION_CODE="$(git rev-list --count HEAD)"
          MIN_GIT_VERSION_CODE="$((GIT_VERSION_CODE + 1))"
          if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
            echo "FATAL: checkout is shallow; versionCode would not be monotonic" >&2
            exit 1
          fi
          EXPECTED_VERSION_CODE="$(npx expo config --json | node -e '
            let input = "";
            process.stdin.on("data", chunk => input += chunk);
            process.stdin.on("end", () => {
              const config = JSON.parse(input);
              const versionCode = config.android && config.android.versionCode;
              if (!Number.isInteger(versionCode) || versionCode < 1) {
                process.exit(1);
              }
              process.stdout.write(String(versionCode));
            });
          ')"
          ACTUAL_VERSION_CODE="$(awk '/versionCode / { print $2; exit }' android/app/build.gradle)"
          if [ -n "${SHELLY_ANDROID_VERSION_CODE:-}" ]; then
            if [ "${EXPECTED_VERSION_CODE}" != "${SHELLY_ANDROID_VERSION_CODE}" ]; then
              echo "FATAL: app.config.ts versionCode ${EXPECTED_VERSION_CODE} does not match SHELLY_ANDROID_VERSION_CODE ${SHELLY_ANDROID_VERSION_CODE}" >&2
              exit 1
            fi
            if [ "${EXPECTED_VERSION_CODE}" -lt "${MIN_GIT_VERSION_CODE}" ]; then
              echo "FATAL: SHELLY_ANDROID_VERSION_CODE ${EXPECTED_VERSION_CODE} is lower than git commit count + 1 (${MIN_GIT_VERSION_CODE})" >&2
              exit 1
            fi
          elif [ "${EXPECTED_VERSION_CODE}" -lt "${MIN_GIT_VERSION_CODE}" ]; then
            echo "FATAL: app.config.ts versionCode ${EXPECTED_VERSION_CODE} is lower than git commit count + 1 (${MIN_GIT_VERSION_CODE})" >&2
            exit 1
          fi
          if [ "${EXPECTED_VERSION_CODE}" -le 1502 ]; then
            echo "FATAL: android versionCode ${EXPECTED_VERSION_CODE} must be greater than the last shipped manual code 1502" >&2
            exit 1
          fi
          if [ "${ACTUAL_VERSION_CODE}" != "${EXPECTED_VERSION_CODE}" ]; then
            echo "FATAL: android/app/build.gradle versionCode ${ACTUAL_VERSION_CODE} does not match app.config.ts ${EXPECTED_VERSION_CODE}" >&2
            exit 1
          fi

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Explicit packages to avoid the action's default `tools platform-tools`
          # request: the legacy `tools` package was removed from Google's SDK
          # repository, and Gradle's Android plugin resolves platform/build-tools
          # itself via sdk.dir, so `tools` was never actually needed here.
          packages: platform-tools

      - name: Free runner disk space before APK build
        run: |
          set -euo pipefail
          echo "Disk before cleanup:"
          df -h /

          sudo rm -rf \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/.ghcup \
            /usr/local/lib/android/sdk/emulator \
            /usr/local/lib/android/sdk/system-images \
            /usr/local/share/boost \
            /usr/share/dotnet
          sudo docker image prune -af || true

          echo "Disk after cleanup:"
          df -h /

      - name: Build Shelly shell launcher
        if: steps.android-payload-cache.outputs.cache-hit != 'true'
        run: |
          JNILIBS="modules/terminal-emulator/android/src/main/jniLibs/arm64-v8a"
          SRC="modules/terminal-emulator/android/src/main/jni/shelly-shell-launcher.c"
          OUT="${GITHUB_WORKSPACE}/${JNILIBS}/libshelly_shell.so"
          NDK_CLANG="${ANDROID_NDK_ROOT}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android29-clang"

          test -x "${NDK_CLANG}" || { echo "NDK clang not found: ${NDK_CLANG}"; exit 1; }
          "${NDK_CLANG}" -fPIE -pie -O2 -Wall -Wextra -Werror \
            "${SRC}" -o "${OUT}"
          chmod 755 "${OUT}"
          ls -lh "${OUT}"
          file "${OUT}"

      - name: Build Shelly xdg-open native helper (bug #102/#115)
        # Native xdg-open replacement. Direct execve target so Android's
        # binfmt_script dispatch (and Samsung Knox's app_data_file
        # `file{read}` denial) is bypassed entirely. Same `-fPIE -pie`
        # toolchain as shelly-shell-launcher above.
        if: steps.android-payload-cache.outputs.cache-hit != 'true'
        run: |
          JNILIBS="modules/terminal-emulator/android/src/main/jniLibs/arm64-v8a"
          SRC="modules/terminal-emulator/android/src/main/jni/shelly-xdg-open.c"
          OUT="${GITHUB_WORKSPACE}/${JNILIBS}/libshelly_xdg_open.so"
          NDK_CLANG="${ANDROID_NDK_ROOT}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android29-clang"

          test -x "${NDK_CLANG}" || { echo "NDK clang not found: ${NDK_CLANG}"; exit 1; }
          "${NDK_CLANG}" -fPIE -pie -O2 -Wall -Wextra -Werror \
            "${SRC}" -o "${OUT}"
          chmod 755 "${OUT}"
          ls -lh "${OUT}"
          file "${OUT}"

      - name: Build Shelly `shelly` command native shim (BASHRC v255)
        # $HOME/bin/shelly -> $SHELLY_LIB_DIR/shelly_cmd. Replaces the v139-v254
        # `#!/system/bin/sh` script, which Knox refuses to exec from any caller
        # that is not the interactive shelly() bash function ("bad
        # interpreter: Permission denied"). Same toolchain as above.
        if: steps.android-payload-cache.outputs.cache-hit != 'true'
        run: |
          JNILIBS="modules/terminal-emulator/android/src/main/jniLibs/arm64-v8a"
          SRC="modules/terminal-emulator/android/src/main/jni/shelly-cmd.c"
          OUT="${GITHUB_WORKSPACE}/${JNILIBS}/libshelly_cmd.so"
          NDK_CLANG="${ANDROID_NDK_ROOT}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android29-clang"

          test -x "${NDK_CLANG}" || { echo "NDK clang not found: ${NDK_CLANG}"; exit 1; }
          "${NDK_CLANG}" -fPIE -pie -O2 -Wall -Wextra -Werror             "${SRC}" -o "${OUT}"
          chmod 755 "${OUT}"
          ls -lh "${OUT}"
          file "${OUT}"

      - name: Resolve APK signing key
        env:
          SIGNING_INPUT: ${{ inputs.signing }}
          SHELLY_RELEASE_KEYSTORE_B64: ${{ secrets.SHELLY_RELEASE_KEYSTORE_B64 }}
          SHELLY_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.SHELLY_RELEASE_KEYSTORE_PASSWORD }}
          SHELLY_RELEASE_KEY_ALIAS: ${{ secrets.SHELLY_RELEASE_KEY_ALIAS }}
          SHELLY_RELEASE_KEY_PASSWORD: ${{ secrets.SHELLY_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mode="${SIGNING_INPUT:-default}"
          if [ "${mode}" = "default" ]; then
            mode="${SHELLY_DEFAULT_SIGNING_MODE}"
          fi
          cert_sha() { keytool -exportcert -rfc "$@" | openssl x509 -outform der | sha256sum | awk '{print $1}'; }
          case "${mode}" in
            release|rotation)
              if [ -z "${SHELLY_RELEASE_KEYSTORE_B64}" ] || [ -z "${SHELLY_RELEASE_KEYSTORE_PASSWORD}" ] \
                || [ -z "${SHELLY_RELEASE_KEY_ALIAS}" ] || [ -z "${SHELLY_RELEASE_KEY_PASSWORD}" ]; then
                echo "FATAL: release signing secrets are missing (SHELLY_RELEASE_KEYSTORE_B64 / _KEYSTORE_PASSWORD / _KEY_ALIAS / _KEY_PASSWORD); refusing to ship a debug-signed APK" >&2
                exit 1
              fi
              keystore="${RUNNER_TEMP}/shelly-release.p12"
              umask 077
              printf '%s' "${SHELLY_RELEASE_KEYSTORE_B64}" | base64 -d > "${keystore}"
              test -s "${keystore}" || { echo "FATAL: decoded release keystore is empty" >&2; exit 1; }
              keystore_cert="$(cert_sha -keystore "${keystore}" -storetype pkcs12 \
                -storepass:env SHELLY_RELEASE_KEYSTORE_PASSWORD -alias "${SHELLY_RELEASE_KEY_ALIAS}")"
              if [ "${keystore_cert}" != "${SHELLY_RELEASE_CERT_SHA256}" ]; then
                echo "FATAL: release keystore certificate ${keystore_cert} does not match pinned ${SHELLY_RELEASE_CERT_SHA256}" >&2
                exit 1
              fi
              if [ "${mode}" = "rotation" ]; then
                legacy_cert="$(cert_sha -keystore signing/legacy-debug.keystore -storepass android -alias androiddebugkey)"
                if [ "${legacy_cert}" != "${SHELLY_LEGACY_DEBUG_CERT_SHA256}" ]; then
                  echo "FATAL: signing/legacy-debug.keystore certificate ${legacy_cert} does not match ${SHELLY_LEGACY_DEBUG_CERT_SHA256}" >&2
                  exit 1
                fi
                test -s signing/shelly-signing-lineage.bin || { echo "FATAL: signing/shelly-signing-lineage.bin missing (run signing-rotation-check.yml with generate_lineage=true)" >&2; exit 1; }
              fi
              echo "SHELLY_RELEASE_STORE_FILE=${keystore}" >> "${GITHUB_ENV}"
              expected="${SHELLY_RELEASE_CERT_SHA256}"
              ;;
            legacy-debug)
              echo "::warning::Signing with the legacy PUBLIC debug key only (pre-rotation build)."
              expected="${SHELLY_LEGACY_DEBUG_CERT_SHA256}"
              ;;
            *)
              echo "FATAL: unknown signing mode '${mode}'" >&2
              exit 1
              ;;
          esac
          echo "SHELLY_SIGNING_MODE=${mode}" >> "${GITHUB_ENV}"
          echo "SHELLY_EXPECTED_CERT_SHA256=${expected}" >> "${GITHUB_ENV}"
          echo "Signing mode: ${mode} (expected current signer SHA-256 ${expected})"

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew :terminal-emulator:externalNativeBuildRelease assembleRelease -x lintVitalAnalyzeRelease --build-cache
        env:
          GRADLE_OPTS: '-Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g"'
          # Consumed by plugins/with-release-signing.js's generated Gradle
          # block only when SHELLY_SIGNING_MODE=release (rotation mode builds
          # an unsigned APK and signs it in the next step). Never echoed.
          SHELLY_RELEASE_STORE_PASSWORD: ${{ secrets.SHELLY_RELEASE_KEYSTORE_PASSWORD }}
          SHELLY_RELEASE_KEY_ALIAS: ${{ secrets.SHELLY_RELEASE_KEY_ALIAS }}
          SHELLY_RELEASE_KEY_PASSWORD: ${{ secrets.SHELLY_RELEASE_KEY_PASSWORD }}

      - name: Sign APK with v3 key rotation
        # APK Signature Scheme v3 proof-of-rotation: v2 (API 24-27) stays signed
        # by the legacy debug key, v3 (API 28+) is signed by the release key
        # with the lineage debug -> release. API 28+ installs signed by the
        # debug key update in place (data kept) and from then on only accept
        # the release key: the lineage revokes the debug key's rollback
        # capability (verified on an emulator by signing-rotation-check.yml).
        if: ${{ env.SHELLY_SIGNING_MODE == 'rotation' }}
        env:
          SHELLY_RELEASE_STORE_PASSWORD: ${{ secrets.SHELLY_RELEASE_KEYSTORE_PASSWORD }}
          SHELLY_RELEASE_KEY_ALIAS: ${{ secrets.SHELLY_RELEASE_KEY_ALIAS }}
        run: |
          set -euo pipefail
          out_dir=android/app/build/outputs/apk/release
          unsigned="$(ls "${out_dir}"/*-unsigned.apk | head -1)"
          test -n "${unsigned}" || { echo "FATAL: unsigned release APK not found" >&2; ls -l "${out_dir}"; exit 1; }
          build_tools="$(ls -d "${ANDROID_HOME:-${ANDROID_SDK_ROOT}}"/build-tools/* | sort -V | tail -1)"
          aligned="${RUNNER_TEMP}/shelly-aligned.apk"
          if "${build_tools}/zipalign" -c -P 16 4 "${unsigned}" >/dev/null; then
            cp "${unsigned}" "${aligned}"
          else
            "${build_tools}/zipalign" -P 16 -f 4 "${unsigned}" "${aligned}"
          fi
          "${build_tools}/apksigner" sign \
            --ks signing/legacy-debug.keystore --ks-key-alias androiddebugkey --ks-pass pass:android --key-pass pass:android \
            --next-signer --ks "${SHELLY_RELEASE_STORE_FILE}" --ks-type pkcs12 --ks-key-alias "${SHELLY_RELEASE_KEY_ALIAS}" \
            --ks-pass env:SHELLY_RELEASE_STORE_PASSWORD --key-pass env:SHELLY_RELEASE_STORE_PASSWORD \
            --lineage signing/shelly-signing-lineage.bin --rotation-min-sdk-version 28 \
            --out "${out_dir}/app-release.apk" "${aligned}"
          rm -f "${unsigned}" "${aligned}" "${out_dir}/app-release.apk.idsig"
          ls -l "${out_dir}"

      - name: Verify APK signing certificate
        run: |
          set -euo pipefail
          rm -f "${RUNNER_TEMP}/shelly-release.p12"
          apk="$(ls android/app/build/outputs/apk/release/*.apk | head -1)"
          test -n "${apk}" || { echo "FATAL: release APK not found" >&2; exit 1; }
          case "${apk}" in *-unsigned.apk) echo "FATAL: release APK is unsigned" >&2; exit 1 ;; esac
          build_tools="$(ls -d "${ANDROID_HOME:-${ANDROID_SDK_ROOT}}"/build-tools/* | sort -V | tail -1)"
          apksigner="${build_tools}/apksigner"
          test -x "${apksigner}" || { echo "FATAL: apksigner not found under ${build_tools}" >&2; exit 1; }
          # Per-line hex digests of signer CERTIFICATES (not public keys), one per line.
          digests() { awk -F': ' '/certificate SHA-256 digest:/ {print tolower($NF)}' | tr -d ': \r' | sort -u | paste -sd ' '; }
          "${apksigner}" verify -v --print-certs "${apk}" | tee "${RUNNER_TEMP}/apk-certs.txt" | grep -E '^(Verified using|Signer|Number of signers)' || true
          if [ "${SHELLY_SIGNING_MODE}" = "rotation" ]; then
            grep -q 'Verified using v3 scheme (APK Signature Scheme v3): true' "${RUNNER_TEMP}/apk-certs.txt" \
              || { echo "FATAL: rotated APK is not verified with APK Signature Scheme v3" >&2; exit 1; }
            v3_signer="$("${apksigner}" verify --print-certs --min-sdk-version 28 "${apk}" | digests)"
            legacy_signer="$("${apksigner}" verify --print-certs --max-sdk-version 27 "${apk}" | digests)"
            lineage="$("${apksigner}" lineage --in "${apk}" --print-certs | awk -F': ' '/certificate SHA-256 digest:/ {print tolower($NF)}' | tr -d ': \r' | paste -sd ' ')"
            echo "API 28+ signer: ${v3_signer}"
            echo "API 24-27 signer: ${legacy_signer}"
            echo "v3 lineage: ${lineage}"
            test "${v3_signer}" = "${SHELLY_RELEASE_CERT_SHA256}" || { echo "FATAL: APK signer ${v3_signer} (API 28+) does not match expected ${SHELLY_RELEASE_CERT_SHA256}" >&2; exit 1; }
            test "${legacy_signer}" = "${SHELLY_LEGACY_DEBUG_CERT_SHA256}" || { echo "FATAL: APK signer ${legacy_signer} (API 24-27) does not match expected legacy ${SHELLY_LEGACY_DEBUG_CERT_SHA256}" >&2; exit 1; }
            test "${lineage}" = "${SHELLY_LEGACY_DEBUG_CERT_SHA256} ${SHELLY_RELEASE_CERT_SHA256}" || { echo "FATAL: APK v3 lineage '${lineage}' is not debug -> release" >&2; exit 1; }
            actual="${v3_signer}"
          else
            actual="$(digests < "${RUNNER_TEMP}/apk-certs.txt")"
            case "${actual}" in *" "*) echo "FATAL: expected exactly one APK signer, got: ${actual}" >&2; exit 1 ;; esac
            if [ "${actual}" != "${SHELLY_EXPECTED_CERT_SHA256}" ]; then
              echo "FATAL: APK signer ${actual} does not match expected ${SHELLY_EXPECTED_CERT_SHA256} for mode ${SHELLY_SIGNING_MODE}" >&2
              exit 1
            fi
          fi
          if [ "${SHELLY_SIGNING_MODE}" != "legacy-debug" ] && [ "${actual}" = "${SHELLY_LEGACY_DEBUG_CERT_SHA256}" ]; then
            echo "FATAL: ${SHELLY_SIGNING_MODE}-mode APK is signed with the public debug key" >&2
            exit 1
          fi
          echo "APK current signer SHA-256: ${actual} (mode ${SHELLY_SIGNING_MODE})"
          echo "SIGNING_CERT_SHA256=${actual}" >> "${GITHUB_ENV}"
          echo "### APK signing: \`${SHELLY_SIGNING_MODE}\` — current signer SHA-256 \`${actual}\`" >> "${GITHUB_STEP_SUMMARY}"

      - name: Validate bionic exec wrapper in APK
        run: |
          set -euo pipefail
          apk="$(ls android/app/build/outputs/apk/release/*.apk | head -1)"
          test -n "${apk}" || { echo "No release APK found"; exit 1; }

          # Marker scan: `strings` only scans a build-config dependent subset
          # of sections and gave a false negative on run 26197566814. A raw
          # byte scan of the whole .so is section-agnostic and deterministic.
          check_marker() {
            so="$1"; marker="$2"
            if grep -qaF "${marker}" "${so}"; then
              echo "OK: marker '${marker}' present in $(basename "${so}")"
            else
              echo "FATAL: marker '${marker}' missing from $(basename "${so}")"
              readelf -SW "${so}" || true
              exit 1
            fi
          }

          unzip -p "${apk}" lib/arm64-v8a/libexec_wrapper.so > /tmp/libexec_wrapper.so
          readelf -n /tmp/libexec_wrapper.so | sed -n '/Build ID/p'
          readelf -d /tmp/libexec_wrapper.so | grep NEEDED || true
          execve_size="$(readelf -Ws /tmp/libexec_wrapper.so | awk '$8=="execve"{print $3; exit}')"
          test -n "${execve_size}" || { echo "FATAL: execve symbol missing from libexec_wrapper.so"; exit 1; }
          echo "libexec_wrapper.so execve size=${execve_size}"
          readlink_size="$(readelf -Ws /tmp/libexec_wrapper.so | awk '$8=="readlink"{print $3; exit}')"
          test -n "${readlink_size}" || { echo "FATAL: readlink symbol missing from libexec_wrapper.so"; exit 1; }
          echo "libexec_wrapper.so readlink size=${readlink_size}"
          readlinkat_size="$(readelf -Ws /tmp/libexec_wrapper.so | awk '$8=="readlinkat"{print $3; exit}')"
          test -n "${readlinkat_size}" || { echo "FATAL: readlinkat symbol missing from libexec_wrapper.so"; exit 1; }
          echo "libexec_wrapper.so readlinkat size=${readlinkat_size}"
          open_size="$(readelf -Ws /tmp/libexec_wrapper.so | awk '$8=="open"{print $3; exit}')"
          test -n "${open_size}" || { echo "FATAL: open symbol missing from libexec_wrapper.so"; exit 1; }
          echo "libexec_wrapper.so open size=${open_size}"
          openat_size="$(readelf -Ws /tmp/libexec_wrapper.so | awk '$8=="openat"{print $3; exit}')"
          test -n "${openat_size}" || { echo "FATAL: openat symbol missing from libexec_wrapper.so"; exit 1; }
          echo "libexec_wrapper.so openat size=${openat_size}"
          if readelf -Ws /tmp/libexec_wrapper.so | awk '$8=="__open_2" || $8=="__openat_2"{found=1} END{exit found ? 0 : 1}'; then
            echo "FATAL: private FORTIFY open symbols must not be exported from libexec_wrapper.so"
            exit 1
          fi
          readelf -d /tmp/libexec_wrapper.so | grep -q 'BIND_NOW' || { echo "FATAL: libexec_wrapper.so must be linked with BIND_NOW"; exit 1; }
          readelf -d /tmp/libexec_wrapper.so | grep -q 'FLAGS_1.*NOW' || { echo "FATAL: libexec_wrapper.so must have FLAGS_1 NOW"; exit 1; }
          readelf -Wr /tmp/libexec_wrapper.so | awk '$3=="R_AARCH64_JUMP_SLOT"{print "libexec_wrapper.so jump_slot " $5}'
          # Keep the LD_PRELOAD hot path free of libc PLT calls. The remaining
          # allowlisted slots are NDK CRT entries plus the constructor's dlsym.
          unexpected_jump_slots="$(readelf -Wr /tmp/libexec_wrapper.so | awk '$3=="R_AARCH64_JUMP_SLOT" && $5 !~ /^(__cxa_finalize|__cxa_atexit|__register_atfork|dlsym)(@|$)/ {print}')"
          if [ -n "${unexpected_jump_slots}" ]; then
            echo "FATAL: libexec_wrapper.so has unexpected PLT relocations"
            echo "${unexpected_jump_slots}"
            exit 1
          fi
          forbidden_jump_slots="$(readelf -Wr /tmp/libexec_wrapper.so | awk '$3=="R_AARCH64_JUMP_SLOT" && $5 ~ /^(getpid|__errno|execve|open|openat|readlink|readlinkat|memcpy|__stack_chk_fail|__memcpy_chk|__strcpy_chk|abort)(@|$)/ {print}')"
          if [ -n "${forbidden_jump_slots}" ]; then
            echo "FATAL: libexec_wrapper.so has crash-prone libc PLT relocations"
            echo "${forbidden_jump_slots}"
            exit 1
          fi
          environ_reloc_count="$(readelf -Wr /tmp/libexec_wrapper.so | awk '$3=="R_AARCH64_GLOB_DAT" && $5 ~ /^environ(@|$)/ {count++} END{print count+0}')"
          test "${environ_reloc_count}" = "0" || { echo "FATAL: libexec_wrapper.so must not depend on libc environ, got ${environ_reloc_count} relocation(s)"; exit 1; }
          readelf -d /tmp/libexec_wrapper.so | grep -q INIT_ARRAY || { echo "FATAL: libexec_wrapper.so constructor INIT_ARRAY missing"; exit 1; }
          grep -qaF 'SHELLY_CODEX_PROC_EXE_OPEN_SHIM' /tmp/libexec_wrapper.so || { echo "FATAL: Codex proc-exe open shim gate missing from libexec_wrapper.so"; exit 1; }
          check_marker /tmp/libexec_wrapper.so 'shelly-exec-wrapper:v223:fd-pinned-linker-exec'
          check_marker /tmp/libexec_wrapper.so 'shelly-exec-wrapper:v220:execvp-environ+system-target-direct'
          check_marker /tmp/libexec_wrapper.so 'shelly-exec-wrapper:v221:system-helpers-keep-wrapper'
          check_marker /tmp/libexec_wrapper.so 'shelly-exec-wrapper:v223:no-blanket-wrapper-reinjection'
          check_marker /tmp/libexec_wrapper.so 'shelly-exec-wrapper:v224:termux-socket-root-redirect'
          check_marker /tmp/libexec_wrapper.so 'shelly-exec-wrapper:v225:codex-remote-host-name'
          readelf -Ws /tmp/libexec_wrapper.so | awk '$8=="gethostname"{found=1} END{exit found ? 0 : 1}' || { echo "FATAL: gethostname interposer missing from libexec_wrapper.so"; exit 1; }

          unzip -p "${apk}" lib/arm64-v8a/libshelly-pty.so > /tmp/libshelly-pty.so
          check_marker /tmp/libshelly-pty.so 'shelly-pty:v184:scoped-loader-env'

          unzip -p "${apk}" lib/arm64-v8a/libshelly_cmd.so > /tmp/libshelly_cmd.so
          check_marker /tmp/libshelly_cmd.so 'shelly-cmd:v1:native-path-shim'

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: shelly-apk
          path: android/app/build/outputs/apk/release/*.apk

      - name: Publish Android update release
        if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.publish) }}
        env:
          GH_TOKEN: ${{ github.token }}
          STABLE_UPDATE_TAG: android-latest
          DEV_UPDATE_TAG: android-dev
          UPDATE_MANIFEST_NAME: latest.json
          CODEX_RUNTIME_TAG: codex-runtime-latest
          CODEX_RUNTIME_MANIFEST_NAME: codex-runtime.json
        run: |
          set -euo pipefail
          # Gate stable-vs-dev on the ref being built, not on how the run was
          # triggered. Before this fix, every workflow_dispatch run — including
          # ones explicitly dispatched with --ref main (the daily Bump Codex
          # Runtime job does exactly this in bump-codex-runtime.yml's "Commit
          # bump to main and trigger release build" step, since a push made
          # with GITHUB_TOKEN cannot retrigger workflows and must fall back to
          # `gh workflow run ... --ref main`) — was misclassified as a
          # dev/pre-release build. That silently starved android-latest and
          # codex-runtime-latest of every automated Codex version bump, while
          # feature-branch workflow_dispatch test builds correctly stayed on
          # the dev channel. Branching on the ref instead fixes both cases.
          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            update_tag="${STABLE_UPDATE_TAG}"
            update_title="Shelly Android latest"
            release_note_heading="Rolling Android update build."
            android_release_extra_args=()
            publish_codex_runtime=1
          else
            update_tag="${DEV_UPDATE_TAG}"
            update_title="Shelly Android dev"
            release_note_heading="Workflow dispatch Android dev build."
            android_release_extra_args=(--prerelease)
            publish_codex_runtime=0
          fi

          apk="$(ls android/app/build/outputs/apk/release/*.apk | head -1)"
          test -n "${apk}" || { echo "FATAL: release APK not found" >&2; exit 1; }
          codex_runtime_tar="${RUNNER_TEMP}/codex-runtime.tar.gz"
          if [ "${publish_codex_runtime}" = "1" ]; then
            test -s "${codex_runtime_tar}" || { echo "FATAL: Codex runtime tarball not found" >&2; exit 1; }
          fi

          config_json="$(npx expo config --json)"
          version_code="$(printf '%s' "${config_json}" | node -e '
            let input = "";
            process.stdin.on("data", chunk => input += chunk);
            process.stdin.on("end", () => {
              const config = JSON.parse(input);
              const versionCode = config.android && config.android.versionCode;
              if (!Number.isInteger(versionCode) || versionCode < 1) process.exit(1);
              process.stdout.write(String(versionCode));
            });
          ')"
          version_name="$(printf '%s' "${config_json}" | node -e '
            let input = "";
            process.stdin.on("data", chunk => input += chunk);
            process.stdin.on("end", () => {
              const config = JSON.parse(input);
              process.stdout.write(String(config.version || ""));
            });
          ')"
          sha256="$(sha256sum "${apk}" | awk '{print $1}')"
          codex_version="$(tr -d '[:space:]' < .ci-versions/codex.txt)"
          codex_termux_version="$(tr -d '[:space:]' < .ci-versions/codex-termux.txt)"
          created_at="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          short_sha="${GITHUB_SHA:0:12}"
          run_attempt="${GITHUB_RUN_ATTEMPT:-1}"
          update_apk_name="Shelly-android-v${version_name}-${version_code}-${GITHUB_RUN_ID}-${run_attempt}-${short_sha}.apk"
          release_apk="${RUNNER_TEMP}/${update_apk_name}"
          cp "${apk}" "${release_apk}"
          apk_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${update_tag}/${update_apk_name}"
          apk_size_bytes="$(wc -c < "${release_apk}" | tr -d '[:space:]')"

          UPDATE_CHANNEL="${update_tag}" \
          VERSION_CODE="${version_code}" \
          VERSION_NAME="${version_name}" \
          SHA256="${sha256}" \
          APK_SIZE_BYTES="${apk_size_bytes}" \
          CODEX_VERSION="${codex_version}" \
          CODEX_TERMUX_VERSION="${codex_termux_version}" \
          APK_URL="${apk_url}" \
          APK_ASSET_NAME="${update_apk_name}" \
          CREATED_AT="${created_at}" \
          SIGNING_MODE="${SHELLY_SIGNING_MODE}" \
          node <<'NODE' > "${UPDATE_MANIFEST_NAME}"
          const manifest = {
            schemaVersion: 1,
            channel: process.env.UPDATE_CHANNEL,
            versionCode: Number(process.env.VERSION_CODE),
            versionName: process.env.VERSION_NAME,
            gitSha: process.env.GITHUB_SHA,
            runId: Number(process.env.GITHUB_RUN_ID),
            runNumber: Number(process.env.GITHUB_RUN_NUMBER),
            createdAt: process.env.CREATED_AT,
            codexVersion: process.env.CODEX_VERSION,
            codexTermuxVersion: process.env.CODEX_TERMUX_VERSION,
            apkAssetName: process.env.APK_ASSET_NAME,
            apkUrl: process.env.APK_URL,
            apkSizeBytes: Number(process.env.APK_SIZE_BYTES),
            sha256: process.env.SHA256,
            signingMode: process.env.SIGNING_MODE,
            signingCertSha256: process.env.SIGNING_CERT_SHA256,
          };
          process.stdout.write(JSON.stringify(manifest, null, 2) + "\n");
          NODE

          cat > /tmp/shelly-android-update-release.md <<EOF
          ${release_note_heading}

          - channel: ${update_tag}
          - versionName: ${version_name}
          - versionCode: ${version_code}
          - codex: ${codex_version}
          - codex-termux: ${codex_termux_version}
          - ref: ${GITHUB_REF_NAME}
          - commit: ${GITHUB_SHA}
          - run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          - sha256: ${sha256}
          - signing: ${SHELLY_SIGNING_MODE} (cert SHA-256 ${SIGNING_CERT_SHA256})
          EOF

          if [ "${publish_codex_runtime}" = "1" ]; then
            codex_runtime_asset_name="Shelly-codex-runtime-v${codex_termux_version#v}-${GITHUB_RUN_ID}-${run_attempt}-${short_sha}.tar.gz"
            codex_runtime_asset="${RUNNER_TEMP}/${codex_runtime_asset_name}"
            cp "${codex_runtime_tar}" "${codex_runtime_asset}"
            codex_runtime_sha256="$(sha256sum "${codex_runtime_asset}" | awk '{print $1}')"
            codex_runtime_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${CODEX_RUNTIME_TAG}/${codex_runtime_asset_name}"

          # The runtime manifest version must equal what `codex_tui --version`
          # prints (the in-app installer refuses a mismatch). codex-termux
          # binaries report the upstream version, without the fork's
          # -termux.N tag suffix, which is exactly .ci-versions/codex.txt.
          CODEX_RUNTIME_VERSION="${codex_version}" \
          CODEX_VERSION="${codex_version}" \
          CODEX_TERMUX_VERSION="${codex_termux_version}" \
          CODEX_RUNTIME_SHA256="${codex_runtime_sha256}" \
          CODEX_RUNTIME_URL="${codex_runtime_url}" \
          CODEX_RUNTIME_ASSET_NAME="${codex_runtime_asset_name}" \
          CREATED_AT="${created_at}" \
          node <<'NODE' > "${CODEX_RUNTIME_MANIFEST_NAME}"
          const manifest = {
            schemaVersion: 1,
            channel: "codex-runtime-latest",
            version: process.env.CODEX_RUNTIME_VERSION,
            codexVersion: process.env.CODEX_VERSION,
            codexTermuxVersion: process.env.CODEX_TERMUX_VERSION,
            gitSha: process.env.GITHUB_SHA,
            runId: Number(process.env.GITHUB_RUN_ID),
            runNumber: Number(process.env.GITHUB_RUN_NUMBER),
            createdAt: process.env.CREATED_AT,
            assetName: process.env.CODEX_RUNTIME_ASSET_NAME,
            tarballUrl: process.env.CODEX_RUNTIME_URL,
            sha256: process.env.CODEX_RUNTIME_SHA256,
          };
          process.stdout.write(JSON.stringify(manifest, null, 2) + "\n");
          NODE

          cat > /tmp/shelly-codex-runtime-release.md <<EOF
          Rolling Codex runtime update.

          - codex: ${codex_version}
          - codex-termux: ${codex_termux_version}
          - commit: ${GITHUB_SHA}
          - run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          - sha256: ${codex_runtime_sha256}
          EOF

            if gh release view "${CODEX_RUNTIME_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
              gh release edit "${CODEX_RUNTIME_TAG}" \
                --repo "${GITHUB_REPOSITORY}" \
                --target "${GITHUB_SHA}" \
                --title "Shelly Codex runtime latest" \
                --notes-file /tmp/shelly-codex-runtime-release.md
            else
              gh release create "${CODEX_RUNTIME_TAG}" \
                --repo "${GITHUB_REPOSITORY}" \
                --target "${GITHUB_SHA}" \
                --title "Shelly Codex runtime latest" \
                --notes-file /tmp/shelly-codex-runtime-release.md \
                --latest=false
            fi

            gh release upload "${CODEX_RUNTIME_TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              "${codex_runtime_asset}"

            uploaded_runtime_asset="$(gh release view "${CODEX_RUNTIME_TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --json assets \
              --jq ".assets[] | select(.name == \"${codex_runtime_asset_name}\")")"
            test -n "${uploaded_runtime_asset}" || { echo "FATAL: uploaded Codex runtime asset not visible in release" >&2; exit 1; }
            uploaded_runtime_digest="$(printf '%s' "${uploaded_runtime_asset}" | node -e '
              let input = "";
              process.stdin.on("data", chunk => input += chunk);
              process.stdin.on("end", () => {
                const asset = JSON.parse(input);
                process.stdout.write(String(asset.digest || ""));
              });
            ')"
            if [ -n "${uploaded_runtime_digest}" ] && [ "${uploaded_runtime_digest}" != "sha256:${codex_runtime_sha256}" ]; then
              echo "FATAL: Codex runtime digest mismatch: ${uploaded_runtime_digest}" >&2
              exit 1
            fi

            gh release upload "${CODEX_RUNTIME_TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              "${CODEX_RUNTIME_MANIFEST_NAME}" \
              --clobber
          fi

          if gh release view "${update_tag}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release edit "${update_tag}" \
              --repo "${GITHUB_REPOSITORY}" \
              --target "${GITHUB_SHA}" \
              --title "${update_title}" \
              --notes-file /tmp/shelly-android-update-release.md \
              "${android_release_extra_args[@]}"
          else
            gh release create "${update_tag}" \
              --repo "${GITHUB_REPOSITORY}" \
              --target "${GITHUB_SHA}" \
              --title "${update_title}" \
              --notes-file /tmp/shelly-android-update-release.md \
              --latest=false \
              "${android_release_extra_args[@]}"
          fi

          gh release upload "${update_tag}" \
            --repo "${GITHUB_REPOSITORY}" \
            "${release_apk}"

          uploaded_asset="$(gh release view "${update_tag}" \
            --repo "${GITHUB_REPOSITORY}" \
            --json assets \
            --jq ".assets[] | select(.name == \"${update_apk_name}\")")"
          test -n "${uploaded_asset}" || { echo "FATAL: uploaded APK asset not visible in release" >&2; exit 1; }
          uploaded_digest="$(printf '%s' "${uploaded_asset}" | node -e '
            let input = "";
            process.stdin.on("data", chunk => input += chunk);
            process.stdin.on("end", () => {
              const asset = JSON.parse(input);
              process.stdout.write(String(asset.digest || ""));
            });
          ')"
          if [ -n "${uploaded_digest}" ] && [ "${uploaded_digest}" != "sha256:${sha256}" ]; then
            echo "FATAL: release APK digest mismatch: ${uploaded_digest}" >&2
            exit 1
          fi

          gh release upload "${update_tag}" \
            --repo "${GITHUB_REPOSITORY}" \
            "${UPDATE_MANIFEST_NAME}" \
            --clobber

      - name: Publish skills catalog release
        # Third sibling release channel alongside android-latest and
        # codex-runtime-latest (see docs/superpowers/DEFERRED.md's SKILL-002
        # entry and lib/skill-catalog.ts's SKILLS_CATALOG_TAG/
        # SKILLS_CATALOG_MANIFEST_ASSET). Unlike the Android APK, the catalog
        # content in docs/skills-catalog/** only changes when someone edits
        # it — but there's no existing "only if these paths changed"
        # precedent anywhere else in this workflow (the whole workflow's
        # own paths-ignore only skips docs-only PUSHES entirely, it isn't a
        # per-step filter), so the simplest safe default is used here too:
        # republish on every qualifying run. The content is static, so a
        # no-op republish is harmless (gh release edit/upload are
        # idempotent for identical bytes) — it just costs a few API calls.
        # NOTE: because this step's inputs live entirely under docs/**, a
        # commit that ONLY touches docs/skills-catalog/** won't reach this
        # step via the push trigger (the workflow's own paths-ignore skips
        # docs-only pushes) — catalog-only edits need a workflow_dispatch
        # run (or to ride along with a non-docs commit, as this change does
        # by also touching this workflow file) to actually publish.
        if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.publish) }}
        env:
          GH_TOKEN: ${{ github.token }}
          SKILLS_CATALOG_TAG: skills-catalog-latest
          SKILLS_CATALOG_MANIFEST_NAME: skills-catalog.json
        run: |
          set -euo pipefail

          # Mirrors the codex-runtime-latest gate above: a single always-on
          # "latest" channel (no dev/stable split like android-latest has),
          # so only publish from an actual main build. workflow_dispatch
          # runs off a feature branch still execute this step (matching the
          # step-level `if:` trigger scope above) but exit early here rather
          # than clobbering the main catalog release with branch content.
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "Skipping skills catalog publish: not building refs/heads/main (ref=${GITHUB_REF})."
            exit 0
          fi

          catalog_dir="docs/skills-catalog"
          manifest_src="${catalog_dir}/${SKILLS_CATALOG_MANIFEST_NAME}"
          test -f "${manifest_src}" || { echo "FATAL: ${manifest_src} not found" >&2; exit 1; }

          # jq -e validates the manifest is well-formed JSON before anything
          # downstream trusts it.
          jq -e '.schemaVersion and (.skills | type == "array")' "${manifest_src}" >/dev/null \
            || { echo "FATAL: ${manifest_src} is not a valid skills catalog manifest" >&2; exit 1; }

          staging_dir="${RUNNER_TEMP}/skills-catalog-assets"
          mkdir -p "${staging_dir}"

          # Recompute each skill's SKILL.md sha256 from the actual file on
          # disk and refuse to publish if it doesn't match what the manifest
          # declares — a stale hash here would make fetchCatalogSkillContent()
          # in lib/skill-catalog.ts fail its integrity check for every user
          # until the next publish fixes it.
          mismatch=0
          while IFS=$'\t' read -r skill_name asset_name expected_sha256; do
            skill_md="${catalog_dir}/${skill_name}/SKILL.md"
            if [ ! -f "${skill_md}" ]; then
              echo "FATAL: ${skill_md} referenced by manifest entry '${skill_name}' does not exist" >&2
              mismatch=1
              continue
            fi
            actual_sha256="$(sha256sum "${skill_md}" | awk '{print $1}')"
            if [ "${actual_sha256}" != "${expected_sha256}" ]; then
              echo "FATAL: sha256 mismatch for '${skill_name}': manifest declares ${expected_sha256}, actual file is ${actual_sha256}. Regenerate ${manifest_src} before publishing." >&2
              mismatch=1
              continue
            fi
            cp "${skill_md}" "${staging_dir}/${asset_name}"
          done < <(jq -r '.skills[] | "\(.name)\t\(.contentAssetName)\t\(.sha256)"' "${manifest_src}")

          if [ "${mismatch}" = "1" ]; then
            exit 1
          fi

          asset_count="$(find "${staging_dir}" -maxdepth 1 -type f | wc -l | tr -d '[:space:]')"
          test "${asset_count}" -gt 0 || { echo "FATAL: skills catalog manifest has zero skills" >&2; exit 1; }

          cat > /tmp/shelly-skills-catalog-release.md <<EOF
          Rolling skills catalog update.

          - commit: ${GITHUB_SHA}
          - run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          - skills: ${asset_count}
          EOF

          if gh release view "${SKILLS_CATALOG_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release edit "${SKILLS_CATALOG_TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --target "${GITHUB_SHA}" \
              --title "Shelly skills catalog latest" \
              --notes-file /tmp/shelly-skills-catalog-release.md
          else
            gh release create "${SKILLS_CATALOG_TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --target "${GITHUB_SHA}" \
              --title "Shelly skills catalog latest" \
              --notes-file /tmp/shelly-skills-catalog-release.md \
              --latest=false
          fi

          gh release upload "${SKILLS_CATALOG_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            "${staging_dir}"/*.SKILL.md \
            --clobber

          # Verify every uploaded per-skill asset's server-side digest before
          # trusting the release — same never-trust-an-upload discipline the
          # APK/codex-runtime blocks above apply.
          uploaded_assets_json="$(gh release view "${SKILLS_CATALOG_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --json assets)"
          while IFS=$'\t' read -r asset_name expected_sha256; do
            uploaded_digest="$(printf '%s' "${uploaded_assets_json}" | jq -r --arg name "${asset_name}" '.assets[] | select(.name == $name) | .digest // ""')"
            test -n "${uploaded_digest}" || { echo "FATAL: uploaded skills catalog asset '${asset_name}' not visible in release" >&2; exit 1; }
            if [ "${uploaded_digest}" != "sha256:${expected_sha256}" ]; then
              echo "FATAL: skills catalog asset '${asset_name}' digest mismatch: ${uploaded_digest}" >&2
              exit 1
            fi
          done < <(jq -r '.skills[] | "\(.contentAssetName)\t\(.sha256)"' "${manifest_src}")

          gh release upload "${SKILLS_CATALOG_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            "${manifest_src}" \
            --clobber

      - name: Publish optional tool pack archives
        # Fable5 roadmap item #6 (2026-08-25): packages a SUBSET of the same
        # already-prepared jniLibs/arm64-v8a binaries this job just built the
        # APK from (committed .so files plus the Termux-fetched ones from the
        # "Bundle Termux extras" step above) into .tar.gz archives for
        # on-demand `shelly install <pack>` (lib/optional-packs.ts,
        # lib/optional-pack-installer.ts). Deliberately does NOT touch what
        # ships in the APK itself — jniLibs/, app.config.ts, and every step
        # above this one are untouched; this only reads the files those
        # steps already produced. Mirrors "Publish skills catalog release"
        # above: staging dir, sha256 recompute, gh release create/edit +
        # upload --clobber, then a post-upload digest verification against
        # the release's own server-side metadata before trusting it.
        #
        # IMPORTANT: this step publishes the archives but deliberately does
        # NOT flip OPTIONAL_PACKS[*].published to true in
        # lib/optional-packs.ts, and does not update its sha256/
        # approxSizeBytes/downloadUrl fields — that is a separate, manual
        # follow-up commit made only after confirming from a real run of
        # this step that the release and assets actually exist and verify
        # correctly. Until that follow-up lands, `shelly install <pack>`
        # keeps refusing with PackNotPublishedError regardless of what this
        # step publishes, so a bad run here cannot affect any user.
        if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.publish) }}
        env:
          GH_TOKEN: ${{ github.token }}
          OPTIONAL_PACKS_TAG: optional-packs-latest
        run: |
          set -euo pipefail

          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "Skipping optional-pack publish: not building refs/heads/main (ref=${GITHUB_REF})."
            exit 0
          fi

          jnilibs="modules/terminal-emulator/android/src/main/jniLibs/arm64-v8a"
          staging_dir="${RUNNER_TEMP}/optional-pack-assets"
          mkdir -p "${staging_dir}"

          # tool name -> jniLibs .so file, matching LibExtractor.kt's LIBS map
          # exactly (lib/optional-packs.ts's OPTIONAL_PACKS.*.tools lists the
          # left-hand side of each pair below).
          declare -A tool_so=(
            [python3]=libpython3.so
            [sqlite3]=libsqlite3_bin.so
            [jq]=libjq_bin.so
            [make]=libmake.so
            [gh]=libgh.so
            [vim]=libvim.so
            [tmux]=libtmux.so
            [nano]=libnano.so
            [less]=libless.so
            [unzip]=libunzip.so
            [rg]=librg.so
          )
          declare -A pack_tools=(
            [dev-tools]="python3 sqlite3 jq make gh"
            [editor-tools]="vim tmux nano less unzip rg"
          )

          summary=""
          for pack_id in "${!pack_tools[@]}"; do
            pack_dir="${staging_dir}/${pack_id}"
            mkdir -p "${pack_dir}"
            for tool in ${pack_tools[$pack_id]}; do
              so_name="${tool_so[$tool]}"
              src="${jnilibs}/${so_name}"
              test -f "${src}" || { echo "FATAL: ${src} not found for pack '${pack_id}' tool '${tool}'" >&2; exit 1; }
              cp "${src}" "${pack_dir}/${tool}"
              chmod 755 "${pack_dir}/${tool}"
            done
            # 2026-08-28: python3 needs its stdlib tree alongside the binary,
            # not just the interpreter itself — LibExtractor.kt's extractAll()
            # extracts the same checked-in modules/.../assets/python3.tar.gz
            # asset to $libDir/python3.13/ for the bundled copy, and
            # HomeInitializer.kt's python3() wrapper sets
            # PYTHONHOME=PYTHONPATH=<resolved binary's dir>/python3.13 (see
            # BASHRC_VERSION 241) — resolved to $SHELLY_LIB_DIR/python3.13 for
            # the bundled copy, or $SHELLY_LIB_DIR/packs/dev-tools/python3.13
            # for a pack install. Without this, `shelly install dev-tools`
            # would extract a python3 binary that immediately fails with
            # "ModuleNotFoundError: No module named 'encodings'" (bootstrap
            # cannot find its own stdlib). Reuse that same source asset here
            # rather than re-deriving it from jniLibs (it isn't one).
            if [ "${pack_id}" = "dev-tools" ]; then
              python_stdlib_asset="modules/terminal-emulator/android/src/main/assets/python3.tar.gz"
              test -f "${python_stdlib_asset}" || { echo "FATAL: ${python_stdlib_asset} not found for dev-tools python3.13 stdlib bundling" >&2; exit 1; }
              tar -xzf "${python_stdlib_asset}" -C "${pack_dir}"
              test -d "${pack_dir}/python3.13" || { echo "FATAL: ${python_stdlib_asset} did not extract a python3.13/ directory into ${pack_dir}" >&2; exit 1; }
            fi
            archive_name="shelly-pack-${pack_id}-arm64.tar.gz"
            tar -C "${pack_dir}" -czf "${staging_dir}/${archive_name}" .
            archive_sha256="$(sha256sum "${staging_dir}/${archive_name}" | awk '{print $1}')"
            archive_bytes="$(stat -c%s "${staging_dir}/${archive_name}")"
            echo "pack=${pack_id} archive=${archive_name} sha256=${archive_sha256} bytes=${archive_bytes} tools=[${pack_tools[$pack_id]}]"
            summary="${summary}- ${archive_name}: sha256=${archive_sha256} bytes=${archive_bytes}\n"
          done

          cat > /tmp/shelly-optional-packs-release.md <<EOF
          Rolling optional-tool-pack archives for \`shelly install <pack>\`.

          Not yet wired up as a supported install path (see
          docs/superpowers/DEFERRED.md) — these assets exist so that step can
          be completed later without a rebuild. Every pack in
          lib/optional-packs.ts still declares \`published: false\` and
          ignores these URLs until a follow-up commit confirms them.

          - commit: ${GITHUB_SHA}
          - run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          EOF
          printf '%b' "${summary}" >> /tmp/shelly-optional-packs-release.md

          if gh release view "${OPTIONAL_PACKS_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release edit "${OPTIONAL_PACKS_TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --target "${GITHUB_SHA}" \
              --title "Shelly optional tool packs (dormant)" \
              --notes-file /tmp/shelly-optional-packs-release.md
          else
            gh release create "${OPTIONAL_PACKS_TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --target "${GITHUB_SHA}" \
              --title "Shelly optional tool packs (dormant)" \
              --notes-file /tmp/shelly-optional-packs-release.md \
              --latest=false
          fi

          gh release upload "${OPTIONAL_PACKS_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            "${staging_dir}"/*.tar.gz \
            --clobber

          # Never-trust-an-upload: verify the release's own server-side
          # digest for each archive before considering this step successful.
          uploaded_assets_json="$(gh release view "${OPTIONAL_PACKS_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --json assets)"
          for archive_path in "${staging_dir}"/*.tar.gz; do
            archive_name="$(basename "${archive_path}")"
            expected_sha256="$(sha256sum "${archive_path}" | awk '{print $1}')"
            uploaded_digest="$(printf '%s' "${uploaded_assets_json}" | jq -r --arg name "${archive_name}" '.assets[] | select(.name == $name) | .digest // ""')"
            test -n "${uploaded_digest}" || { echo "FATAL: uploaded pack asset '${archive_name}' not visible in release" >&2; exit 1; }
            if [ "${uploaded_digest}" != "sha256:${expected_sha256}" ]; then
              echo "FATAL: pack asset '${archive_name}' digest mismatch: ${uploaded_digest}" >&2
              exit 1
            fi
          done

      - name: Publish EAS Update (OTA)
        # Expo Updates are disabled in app.config.ts for the v5.1.x release
        # train. JS changes ship through APK releases only, so scheduled APK
        # builds must not fail after a successful artifact upload just because
        # EAS Update rejects the inactive runtime/sdk combination.
        if: ${{ vars.ENABLE_EAS_UPDATE == 'true' }}
        run: eas update --platform android --branch preview --message "${MSG:-manual build}" --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          MSG: ${{ github.event.head_commit.message }}
